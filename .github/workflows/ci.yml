name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Backstage supports Postgres and SQLite. Left alone in CI, TestDatabases
    # would start a container per test file for every Postgres and MySQL
    # version it knows; instead the backend tests share this one Postgres, plus
    # SQLite, which needs no container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn prettier:check

      - name: Type-check
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      - name: Build
        run: yarn build:all

      - name: Test
        run: yarn test
        env:
          BACKSTAGE_TEST_DISABLE_DOCKER: '1'
          BACKSTAGE_TEST_DATABASE_POSTGRES18_CONNECTION_STRING: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}
