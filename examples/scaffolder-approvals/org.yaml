# The people and groups the example template's gate refers to.
#
# `selfApprove` is false, so `requester` cannot approve their own request even
# though they are a member of devx-team — which is exactly the case worth having
# real data for.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: devx-team
  description: Owns developer experience, and approves access requests
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: requester
spec:
  memberOf: [devx-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alice
spec:
  memberOf: [devx-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: bob
spec:
  memberOf: [devx-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: outsider
spec:
  memberOf: []
