# Deployment configuration for ${{ values.name }}.
# Generated by the provision-service template from approval request
# ${{ values.approvalRequest }}. Strings that came from the form are written
# as JSON, which is valid YAML, so quotes and colons in them cannot break it.
service: ${{ values.name }}
owner: ${{ values.owner }}
tier: ${{ values.tier }}
lifecycle: ${{ values.lifecycle }}
runtime:
  language: ${{ values.language }}
{%- if values.language == 'typescript' %}
  version: ${{ values.nodeVersion | dump }}
{%- elif values.language == 'go' %}
  version: ${{ values.goVersion | dump }}
{%- elif values.language == 'java' %}
  version: ${{ values.javaVersion }}
  buildTool: ${{ values.buildTool }}
{%- else %}
  version: ${{ values.pythonVersion | dump }}
{%- endif %}
{%- if values.containerised %}
  image: ${{ values.baseImage | dump }}
{%- endif %}
resources:
  replicas: ${{ values.replicas }}
  cpu: ${{ values.cpu }}
  memoryMb: ${{ values.memoryMb }}
regions: ${{ values.regions | dump }}
environments: ${{ values.environments | dump }}
alerting:
  channels: ${{ values.alertChannels | dump }}
  oncall: ${{ values.oncall | dump }}
data:
  classification: ${{ values.dataClassification }}
{%- if values.securityReview %}
  securityReview: ${{ values.securityReview }}
  retentionDays: ${{ values.retentionDays }}
{%- endif %}
launchDate: ${{ values.launchDate | dump }}
